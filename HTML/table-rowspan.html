<!DOCTYPE html>
<html lang="en">

<head>
    <title>Table Row Span</title>
    <style>
        table,
        th,
        td {
            border: 1px solid blue;
            border-collapse: collapse;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <th>ID </th>
            <th>Name </th>
            <th> Age</th>
        </tr>
        <tr>
            <td rowspan="2">11</td>
            <td>Mohammed</td>
            <td>19</td>
        </tr>
        <tr>
            
            <td>Ali</td>
            <td>22</td>
        </tr>

    </table>

</body>

</html>
